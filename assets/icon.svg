<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Asustor ACC for Linux app icon (MIT, original work, not derived from
       ASUSTOR artwork): neon line art of a rackmount server, three units
       with drive slots and status LEDs. -->
  <defs>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse"
                    x1="96" y1="128" x2="416" y2="400">
      <stop offset="0" stop-color="#22d9ff"/>
      <stop offset="1" stop-color="#3bffa0"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.95">
      <stop offset="0" stop-color="#0d151f"/>
      <stop offset="1" stop-color="#04060a"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <!-- three rack units -->
    <g fill="none" stroke="url(#neon)" stroke-width="16" stroke-linecap="round">
      <rect x="96" y="128" width="320" height="72" rx="16"/>
      <rect x="96" y="222" width="320" height="72" rx="16"/>
      <rect x="96" y="316" width="320" height="72" rx="16"/>
    </g>
    <!-- drive slots -->
    <g fill="none" stroke="url(#neon)" stroke-width="12" stroke-linecap="round">
      <line x1="132" y1="166" x2="268" y2="166"/>
      <line x1="132" y1="258" x2="268" y2="258"/>
      <line x1="132" y1="352" x2="268" y2="352"/>
    </g>
    <!-- status LEDs: top unit active -->
    <circle cx="372" cy="166" r="12" fill="#3bffa0"/>
    <circle cx="372" cy="258" r="12" fill="#17475c"/>
    <circle cx="372" cy="352" r="12" fill="#17475c"/>
  </g>
</svg>
