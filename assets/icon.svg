<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Asustor ACC for Linux — original icon (MIT), sleek edition.
       Single-weight line art: NAS unit + discovery signal, gradient
       stroke, lowercase wordmark. Not derived from ASUSTOR artwork. -->
  <defs>
    <linearGradient id="stroke" gradientUnits="userSpaceOnUse"
                    x1="116" y1="140" x2="400" y2="330">
      <stop offset="0" stop-color="#22d9ff"/>
      <stop offset="1" stop-color="#3bffa0"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.9">
      <stop offset="0" stop-color="#0d151f"/>
      <stop offset="1" stop-color="#04060a"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>

  <!-- NAS unit: single-weight rounded outline with two drive slots -->
  <g fill="none" stroke="url(#stroke)" stroke-width="18" stroke-linecap="round"
     filter="url(#soft)">
    <rect x="118" y="146" width="162" height="176" rx="26"/>
    <line x1="152" y1="202" x2="246" y2="202"/>
    <line x1="152" y1="252" x2="246" y2="252"/>
  </g>

  <!-- discovery signal: dot + two arcs, clear of the unit -->
  <g filter="url(#soft)">
    <circle cx="318" cy="188" r="11" fill="#3bffa0"/>
    <g fill="none" stroke="#3bffa0" stroke-width="16" stroke-linecap="round">
      <path d="M 344 148 a 66 66 0 0 1 20 47"/>
      <path d="M 376 116 a 112 112 0 0 1 34 80" opacity="0.5"/>
    </g>
  </g>

  <!-- wordmark: lowercase, light, wide tracking -->
  <text x="268" y="424" text-anchor="middle"
        font-family="DejaVu Sans, Verdana, sans-serif" font-weight="300"
        font-size="96" letter-spacing="22" fill="#eef4f8">acc</text>
</svg>
