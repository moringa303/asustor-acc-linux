<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Asustor ACC for Linux app icon (MIT, original work, not derived from
       ASUSTOR artwork): a hard disk drive in thin line art on dark grey. -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="#202124"
        stroke="#ffffff" stroke-opacity="0.1" stroke-width="4"/>

  <!-- drive body and platter -->
  <g fill="none" stroke="#e6ecf5" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <rect x="96" y="176" width="320" height="160" rx="28"/>
    <circle cx="196" cy="256" r="52"/>
  </g>
  <!-- spindle hub -->
  <circle cx="196" cy="256" r="10" fill="#e6ecf5"/>
  <!-- activity LED -->
  <circle cx="366" cy="256" r="10" fill="#22d3ee"/>
</svg>
