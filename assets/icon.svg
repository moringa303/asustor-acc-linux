<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Asustor ACC for Linux app icon (MIT, original work, not derived from
       ASUSTOR artwork): a three-bay NAS tower in thin line art, with three
       straight rays for the announcement the app listens for. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b2e"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>

  <!-- NAS tower: outlines only (body, front bezel, three drive bays) -->
  <g fill="none" stroke="#e6ecf5" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <rect x="88" y="120" width="168" height="272" rx="20"/>
    <rect x="120" y="152" width="104" height="208" rx="10"/>
    <path d="M 146 202 H 170 M 146 256 H 170 M 146 310 H 170"/>
  </g>
  <!-- drive LEDs -->
  <g fill="#22d3ee">
    <circle cx="198" cy="202" r="8"/>
    <circle cx="198" cy="256" r="8"/>
    <circle cx="198" cy="310" r="8"/>
  </g>

  <!-- announcement: three straight rays leaving the tower -->
  <g fill="none" stroke="#22d3ee" stroke-width="16" stroke-linecap="round">
    <path d="M 324 230.7 L 410.9 169.9"/>
    <path d="M 332 256 L 438 256"/>
    <path d="M 324 281.3 L 410.9 342.1"/>
  </g>
</svg>
