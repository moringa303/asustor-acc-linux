name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.4.0 (tag v<version> is created on the chosen branch)"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Version from tag
        if: github.event_name == 'push'
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Version from input, create the tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ inputs.version }}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          git config user.name "Frank Eckardt"
          git config user.email "frank@takindo.com"
          git tag -a "v${VERSION}" -m "${VERSION}"
          git push origin "v${VERSION}"
      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o acc ./cmd/acc
      - name: Stage file tree
        run: |
          mkdir -p stage/usr/bin stage/usr/share/applications
          install -m755 acc stage/usr/bin/acc
          install -m755 gui/acc-gui.py stage/usr/bin/acc-gui
          sed -i "s/^GUI_VERSION = \"dev\"/GUI_VERSION = \"${VERSION}\"/" stage/usr/bin/acc-gui
          grep -q "^GUI_VERSION = \"${VERSION}\"" stage/usr/bin/acc-gui
          for s in 48 64 128 256 512; do
            install -Dm644 "assets/icon-$s.png" \
              "stage/usr/share/icons/hicolor/${s}x${s}/apps/io.github.moringa303.AsustorAcc.png"
          done
          install -m644 packaging/io.github.moringa303.AsustorAcc.desktop stage/usr/share/applications/
      - name: Build .deb
        run: |
          mkdir -p deb/DEBIAN && cp -r stage/usr deb/
          cat > deb/DEBIAN/control <<EOF
          Package: asustor-acc-linux
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Asustor ACC for Linux contributors
          Depends: python3-gi, gir1.2-gtk-4.0, xdg-utils
          Recommends: gvfs-backends
          Section: net
          Priority: optional
          Description: Native ASUSTOR NAS discovery and management for Linux
           Unofficial Linux version of ASUSTOR Control Center: mDNS discovery, ADM web UI
           launcher, Wake-on-LAN. CLI (acc) plus GTK4 GUI (acc-gui).
          EOF
          dpkg-deb --build --root-owner-group deb "asustor-acc-linux_${VERSION}_amd64.deb"
      - name: Build .rpm
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          mkdir -p rpmtop/{SPECS,BUILD,RPMS,SOURCES,SRPMS}
          cat > rpmtop/SPECS/pkg.spec <<EOF
          Name: asustor-acc-linux
          Version: ${VERSION}
          Release: 1
          Summary: Native ASUSTOR NAS discovery and management for Linux
          License: MIT
          Requires: python3-gobject, gtk4, xdg-utils
          Recommends: gvfs-smb
          %description
          Unofficial Linux version of ASUSTOR Control Center: mDNS discovery, ADM web UI
          launcher, Wake-on-LAN. CLI (acc) plus GTK4 GUI (acc-gui).
          %install
          cp -r ${PWD}/stage/* %{buildroot}/
          %files
          /usr/bin/acc
          /usr/bin/acc-gui
          /usr/share/applications/io.github.moringa303.AsustorAcc.desktop
          /usr/share/icons/hicolor/*/apps/io.github.moringa303.AsustorAcc.png
          EOF
          rpmbuild --define "_topdir ${PWD}/rpmtop" \
            --define "__brp_mangle_shebangs %{nil}" \
            --define "debug_package %{nil}" --define "__strip /bin/true" \
            -bb rpmtop/SPECS/pkg.spec
          cp rpmtop/RPMS/x86_64/*.rpm .
      - name: Build tarball
        run: |
          T="asustor-acc-linux-${VERSION}"
          mkdir -p "$T" && cp -r stage/usr "$T/" && install -m755 packaging/install.sh "$T/"
          tar czf "${T}-linux-amd64.tar.gz" "$T"
      - name: Stable asset names
        # Version-free copies so the README's "latest release" links keep
        # working: .../releases/latest/download/<name>.
        run: |
          cp asustor-acc-linux_*_amd64.deb asustor-acc-linux_amd64.deb
          cp asustor-acc-linux-*.x86_64.rpm asustor-acc-linux.x86_64.rpm
          cp asustor-acc-linux-*-linux-amd64.tar.gz asustor-acc-linux-linux-amd64.tar.gz
      - name: Checksums
        run: sha256sum acc *.deb *.rpm *.tar.gz > SHA256SUMS
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            acc
            *.deb
            *.rpm
            *.tar.gz
            SHA256SUMS
